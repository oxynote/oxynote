suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
  - templates/statefulset.yaml
set:
  publicUrl: https://docs.example.com
tests:
  - it: creates its own account with no API token
    template: templates/serviceaccount.yaml
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
      - equal:
          path: metadata.name
          value: RELEASE-NAME-oxynote

  - it: uses the default account when told not to create one
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
        template: templates/statefulset.yaml
