providers:
  kubernetesIngress:
    enabled: true
  kubernetesGateway:
    enabled: true
gateway:
  name: oxynote-ci
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All
service:
  spec:
    type: NodePort
ports:
  web:
    nodePort: 30080
  websecure:
    expose:
      default: false
