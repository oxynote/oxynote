# the production all-in-one image under test, with the backing services a
# real deployment gives it. This is docker/prod/docker-compose.example.yaml
# — the deployment the README documents — retuned for a test run.
#
# it differs from docker-compose.dev.yaml (the dev stack) in what it is testing,
# not in how: there, four containers built from this checkout; here, the one
# image an operator actually pulls, with caddy, web, core and auth-realtime
# supervised inside it. Everything the suite asserts about the product must
# hold for both.
#
# the same fixture rules apply:
#   - no named volumes, so every run starts from an empty database and an
#     empty data volume (the generated secrets are regenerated per run)
#   - no container_name, and its own ports (:19080 front door, :19081 the
#     instance without email, :19082 the single-workspace instance, :19083
#     and :19084 the OIDC instances, :19180 keycloak, :19025 mailpit), so it
#     coexists with the dev stack and the e2e dev stack alike
#   - env is inlined and committed; there is nothing secret to protect
#   - every image is pinned
#   - no OXYNOTE_DB_DSN, OXYNOTE_VALKEY_DSN or OXYNOTE_OBJECT_STORAGE_DSN, which
#     is the default single-node deployment: the image runs its own
#     PostgreSQL, the assistant keeps its conversations in the core process,
#     better-auth keeps no secondary storage, and uploaded images live on the
#     data volume
#
# the image is built by `make prod-build`, not by compose: core's binary has
# to come from goreleaser and be staged for the Dockerfile's COPY, so there
# is no build section here to point at. `make e2e-prod-stack-build` tags it
# :e2e-prod, so a run cannot replace the :prod image `make prod-run` uses.

name: oxynote-e2e-prod

services:
  oxynote:
    image: ghcr.io/oxynote/oxynote:e2e-prod
    ports:
      - "19080:8080"
    environment:
      - OXYNOTE_PUBLIC_URL=http://localhost:19080
      - OXYNOTE_SMTP_DSN=smtp://mailpit:1025?tls=none
      - OXYNOTE_EMAIL_FROM_ADDRESS=Oxynote <team@oxynote.io>
      - OXYNOTE_MAX_ORGANIZATION_MEMBERS=5
      # every test signs up and creates its own workspace, and a stack left
      # up for a day of iteration would hit a lower cap and start failing
      # signups with a full-house message.
      - OXYNOTE_MAX_ORGANIZATIONS=100000
      # every request in a run arrives from one address, and better-auth
      # gives sign-in and sign-up three per ten seconds between them, so the
      # limiter would fail the suite rather than the code under test.
      - OXYNOTE_RATE_LIMIT_DISABLED=true
    # the image ships its own layered probe (every internal service plus the
    # front door), which is what the probe container and the tests wait on.
    # Its start period is three minutes; compose inherits that.
    #
    # the image shuts its services down in order, flushing open documents
    # last, and docker's default 10s grace would SIGKILL that mid-flush.
    stop_grace_period: 60s

  # the same image with no email sender, which is all it takes to run the
  # product without email: the launcher derives the switch from the missing
  # OXYNOTE_SMTP_DSN. tests/prod-without-email.test.ts drives it through its
  # own front door; every other test stays on the instance above.
  oxynote-without-email:
    image: ghcr.io/oxynote/oxynote:e2e-prod
    ports:
      - "19081:8080"
    environment:
      - OXYNOTE_PUBLIC_URL=http://localhost:19081
      - OXYNOTE_MAX_ORGANIZATION_MEMBERS=5
      # the same two allowances as the instance above, for the same reasons.
      - OXYNOTE_MAX_ORGANIZATIONS=100000
      - OXYNOTE_RATE_LIMIT_DISABLED=true
    stop_grace_period: 60s

  # the same image with the workspace limits left at their defaults: one
  # workspace, created with its admin at boot, and signup by invitation
  # only. tests/prod-single-workspace.test.ts drives it through its own
  # front door. Its tests share that one workspace, so no other test may
  # use this instance.
  oxynote-single-workspace:
    image: ghcr.io/oxynote/oxynote:e2e-prod
    ports:
      - "19082:8080"
    environment:
      - OXYNOTE_PUBLIC_URL=http://localhost:19082
      - OXYNOTE_SMTP_DSN=smtp://mailpit:1025?tls=none
      - OXYNOTE_EMAIL_FROM_ADDRESS=Oxynote <team@oxynote.io>
      # the same limiter allowance as the instance above.
      - OXYNOTE_RATE_LIMIT_DISABLED=true
    stop_grace_period: 60s

  # the same image signing in through keycloak, with any number of
  # workspaces. Only the OIDC sign-in tests drive it.
  #
  # the issuer is keycloak's address on the private network. Discovery
  # through it sends the browser to keycloak's published port, so both
  # sides reach keycloak at the issuer keycloak names itself.
  oxynote-oidc:
    image: ghcr.io/oxynote/oxynote:e2e-prod
    ports:
      - "19083:8080"
    environment:
      - OXYNOTE_PUBLIC_URL=http://localhost:19083
      - OXYNOTE_SMTP_DSN=smtp://mailpit:1025?tls=none
      - OXYNOTE_EMAIL_FROM_ADDRESS=Oxynote <team@oxynote.io>
      - OXYNOTE_MAX_ORGANIZATION_MEMBERS=5
      - OXYNOTE_MAX_ORGANIZATIONS=100000
      - OXYNOTE_RATE_LIMIT_DISABLED=true
      - OXYNOTE_SOCIAL_LOGIN_OIDC_ISSUER_URL=http://keycloak:8080/realms/oxynote
      - OXYNOTE_SOCIAL_LOGIN_OIDC_CLIENT_ID=oxynote
      - OXYNOTE_SOCIAL_LOGIN_OIDC_CLIENT_SECRET=oxynote-e2e-secret
      - OXYNOTE_SOCIAL_LOGIN_OIDC_DISPLAY_NAME=Keycloak
    # discovery runs once at boot, and a failed one stops the image.
    depends_on:
      keycloak:
        condition: service_healthy
    stop_grace_period: 60s

  # one workspace that only keycloak signs in to, whose first user becomes
  # the admin. Its tests share that workspace, so like the single-workspace
  # instance above, no other test may use it.
  oxynote-oidc-single-workspace:
    image: ghcr.io/oxynote/oxynote:e2e-prod
    ports:
      - "19084:8080"
    environment:
      - OXYNOTE_PUBLIC_URL=http://localhost:19084
      - OXYNOTE_SMTP_DSN=smtp://mailpit:1025?tls=none
      - OXYNOTE_EMAIL_FROM_ADDRESS=Oxynote <team@oxynote.io>
      - OXYNOTE_RATE_LIMIT_DISABLED=true
      - OXYNOTE_SOCIAL_LOGIN_OIDC_ISSUER_URL=http://keycloak:8080/realms/oxynote
      - OXYNOTE_SOCIAL_LOGIN_OIDC_CLIENT_ID=oxynote
      - OXYNOTE_SOCIAL_LOGIN_OIDC_CLIENT_SECRET=oxynote-e2e-secret
      - OXYNOTE_SOCIAL_LOGIN_OIDC_DISPLAY_NAME=Keycloak
      - OXYNOTE_PASSWORD_LOGIN_DISABLED=true
    depends_on:
      keycloak:
        condition: service_healthy
    stop_grace_period: 60s

  # the identity provider of both OIDC instances. Its realm comes from the
  # inline config below. The tests create their own users through the admin
  # API, and alice (verified) and bob (unverified), both with their name as
  # password, are there for trying it by hand. The admin console is at
  # http://localhost:19180 as admin/admin.
  #
  # KC_HOSTNAME is the address the browser uses. The dynamic backchannel
  # lets the instances fetch tokens and keys through keycloak:8080, while
  # every token still names the browser's address as its issuer.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=http://localhost:19180
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HEALTH_ENABLED=true
    ports:
      - "19180:8080"
    configs:
      - source: keycloak-realm
        target: /opt/keycloak/data/import/oxynote.json
    # the image has no curl or wget, so bash asks the management port.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 60

  # a sibling on the private network, and the only honest way to ask the
  # question the trust boundary answers: can a container that is not caddy
  # reach core, auth-realtime or the web server directly? The prod tests
  # drive it with `docker compose exec` — see helpers/prod.ts.
  #
  # probing published host ports instead would prove nothing: the internal
  # ports are not published, so every such probe would pass whether the
  # services bound loopback or the wildcard.
  probe:
    image: alpine:3.24.3
    command: ["sleep", "infinity"]
    depends_on:
      oxynote:
        condition: service_healthy

  # the tests read verification links out of mailpit's REST API, so its http
  # port is published rather than proxied through the image's front door —
  # which routes nothing but the product.
  mailpit:
    image: axllent/mailpit:v1.33.0
    environment:
      - MP_QUIET=true
    ports:
      - "19025:8025"

configs:
  keycloak-realm:
    content: |
      {
        "realm": "oxynote",
        "enabled": true,
        "sslRequired": "none",
        "verifyEmail": false,
        "registrationAllowed": false,
        "clients": [
          {
            "clientId": "oxynote",
            "enabled": true,
            "protocol": "openid-connect",
            "publicClient": false,
            "secret": "oxynote-e2e-secret",
            "standardFlowEnabled": true,
            "directAccessGrantsEnabled": false,
            "redirectUris": [
              "http://localhost:19083/auth-realtime/api/auth/callback/oidc",
              "http://localhost:19084/auth-realtime/api/auth/callback/oidc"
            ],
            "attributes": {
              "pkce.code.challenge.method": "S256",
              "post.logout.redirect.uris": "http://localhost:19083/login##http://localhost:19084/login"
            }
          }
        ],
        "users": [
          {
            "username": "alice",
            "email": "alice@oxynote.test",
            "emailVerified": true,
            "firstName": "Alice",
            "lastName": "Example",
            "enabled": true,
            "credentials": [{ "type": "password", "value": "alice" }]
          },
          {
            "username": "bob",
            "email": "bob@oxynote.test",
            "emailVerified": false,
            "firstName": "Bob",
            "lastName": "Example",
            "enabled": true,
            "credentials": [{ "type": "password", "value": "bob" }]
          }
        ]
      }
