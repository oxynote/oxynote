services:
  caddy:
    image: caddy:2.9-alpine
    container_name: caddy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
    restart: unless-stopped
    ports:
      - "13321:13321"
      - "13340:13340"
      - "13341:13341"
      - "13350:13350"
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  heimdall-guard:
    container_name: heimdall-guard
    image: ghcr.io/oxynote/heimdall-guard:dev
    environment:
      - HEIMDALL_GUARD_BACKEND_URL=http://heimdall-gate:8080
      - HEIMDALL_GUARD_DB_DSN=postgresql://devuser:devpass@postgres/devdb?sslmode=disable
      - HEIMDALL_GUARD_VALKEY_URL=redis://valkey:6379
    env_file:
      - .env.guard
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  heimdall-gate:
    container_name: heimdall-gate
    image: ghcr.io/oxynote/heimdall-gate:dev
    environment:
      - HEIMDALL_GATE_DB_DSN=postgresql://devuser:devpass@postgres/devdb?sslmode=disable
      - HEIMDALL_GATE_GITHUB_PRIVATE_KEY_PATH=/etc/heimdall/gate/oxynote.private-key.pem
      - HEIMDALL_GATE_MEILISEARCH_DSN=http://meilisearch:7700
      - HEIMDALL_GATE_MEILISEARCH_MASTER_KEY=devmasterkey
      - HEIMDALL_GATE_VALKEY_NETWORK=tcp
      - HEIMDALL_GATE_VALKEY_ADDRESS=valkey:6379
      - HEIMDALL_GATE_SERVER_AUTH_BETTER_AUTH_URL=http://heimdall-guard:13321/api/auth/get-session
      - HEIMDALL_GATE_SERVER_PUBLIC_URL=http://localhost:13321/go
      - HEIMDALL_GATE_SERVER_DEMO_PROMETHEUS_URL=http://prometheus:9090
      - HEIMDALL_GATE_STORAGE_URL=http://minio:9000
      - HEIMDALL_GATE_STORAGE_ACCESS_KEY=sparta
      - HEIMDALL_GATE_STORAGE_SECRET_KEY=chad_warrior
      - HEIMDALL_GATE_STORAGE_BUCKET=dev
      - HEIMDALL_GATE_CHANGEDETECTION_API_URL=http://changedetection:5000
      - HEIMDALL_GATE_CONNECTOR_URL=http://heimdall-connector:8080
      - HEIMDALL_GATE_NODE_URL=http://heimdall-guard:13321
    env_file:
      - .env.gate
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
      heimdall-connector:
        condition: service_started
    volumes:
      - ./github/oxynote.private-key.pem:/etc/heimdall/gate/oxynote.private-key.pem
    restart: unless-stopped
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  heimdall-connector:
    container_name: heimdall-connector
    image: ghcr.io/oxynote/heimdall-connector:dev
    restart: unless-stopped
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  heimdall-datagen:
    container_name: heimdall-datagen
    image: ghcr.io/oxynote/heimdall-datagen:dev
    environment:
      - DATAGEN_POSTGRES_DSN=postgresql://demouser:demopass@postgres/demodb?sslmode=disable
      - DATAGEN_MARIADB_DSN=demouser:demopass@tcp(mariadb:3306)/demodb?parseTime=true
    depends_on:
      postgres:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  postgres:
    image: postgres:16.4-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-demo-db.sh:/docker-entrypoint-initdb.d/init-demo-db.sh
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d devdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  mariadb:
    image: mariadb:11-noble
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/init-demo-db.sql:/docker-entrypoint-initdb.d/init-demo-db.sql
    environment:
      MARIADB_ROOT_PASSWORD: devroot
      MARIADB_USER: devuser
      MARIADB_PASSWORD: devpass
      MARIADB_DATABASE: devdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  meilisearch:
    container_name: meilisearch
    image: getmeili/meilisearch:v1.23
    volumes:
      - meilisearch_data:/meili_data
    environment:
      - MEILI_MASTER_KEY=devmasterkey
      - MEILI_ENV=development
    restart: unless-stopped
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  valkey:
    container_name: valkey
    image: valkey/valkey:9.0-alpine
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  minio:
    container_name: minio
    image: minio/minio
    command: server --console-address ":9001" /data
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=sparta
      - MINIO_ROOT_PASSWORD=chad_warrior
    restart: unless-stopped
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  changedetection:
    container_name: changedetection
    image: dgtlmoon/changedetection.io
    volumes:
      - changedetection_data:/datastore
    environment:
      - HIDE_REFERER=true
      - LOGGER_LEVEL=WARNING
      - PLAYWRIGHT_DRIVER_URL=ws://browser-sockpuppet-chrome:3000
    depends_on:
      browser-sockpuppet-chrome:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  browser-sockpuppet-chrome:
    container_name: browser-sockpuppet-chrome
    hostname: browser-sockpuppet-chrome
    image: dgtlmoon/sockpuppetbrowser:latest
    cap_add:
      - SYS_ADMIN # TODO: Recommended in their docker-compose example, need to double-check this.
    restart: unless-stopped
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1024
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=10
      - LOG_LEVEL=WARNING
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus:/etc/prometheus/
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "13000:3000"
    volumes:
      - grafana_storage:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  minio_data:
  mariadb_data:
  postgres_data:
  meilisearch_data:
  valkey_data:
  caddy_data:
  caddy_config:
  changedetection_data:
  prometheus_data:
  grafana_storage:
