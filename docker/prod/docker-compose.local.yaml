# what `make prod-run` layers on top of the example deployment so the image
# can be driven from a browser on this machine. It is not part of the
# deployment operators copy — docker-compose.example.yaml is that file, and
# it stays as documented.
#
# it adds mail. The example runs without an email sender, which switches off
# signup verification and password reset; this starts the mail sink the
# example describes in a comment and points the image at it, so a local run
# goes through the same flows as a deployment with a relay. The delivered
# mail is read at http://localhost:8025.

name: oxynote-prod

services:
  oxynote:
    environment:
      - OXYNOTE_SMTP_DSN=smtp://mailpit:1025?tls=none
      - OXYNOTE_EMAIL_FROM_ADDRESS=Oxynote <team@example.com>
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.31.3
    environment:
      - MP_QUIET=true
    ports:
      - "8025:8025"
    restart: unless-stopped
