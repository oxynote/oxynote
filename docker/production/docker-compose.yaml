services:
  caddy:
    image: caddy:2.9-alpine
    container_name: caddy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile
    env_file:
      - ./env/env.caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  heimdall-guard:
    container_name: heimdall-guard
    image: ghcr.io/oxynote/heimdall-guard:dev
    environment:
      - HEIMDALL_GUARD_BACKEND_URL=http://heimdall-gate:8080
      - HEIMDALL_GUARD_DB_DSN=postgresql://root:pass@postgres/db?sslmode=disable
      - HEIMDALL_GUARD_VALKEY_URL=redis://valkey:6379
    env_file:
      - ./env/env.guard
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  heimdall-gate:
    container_name: heimdall-gate
    image: ghcr.io/oxynote/heimdall-gate:dev
    networks:
      - default
      - connector
    environment:
      - HEIMDALL_GATE_DB_DSN=postgresql://root:pass@postgres/db?sslmode=disable
      - HEIMDALL_GATE_MEILISEARCH_DSN=http://meilisearch:7700
      - HEIMDALL_GATE_GITHUB_PRIVATE_KEY_PATH=/etc/oxynote/github/oxynote.private-key.pem
      - HEIMDALL_GATE_VALKEY_NETWORK=tcp
      - HEIMDALL_GATE_VALKEY_ADDRESS=valkey:6379
      - HEIMDALL_GATE_SERVER_AUTH_BETTER_AUTH_URL=http://heimdall-guard:13321/api/auth/get-session
      - HEIMDALL_GATE_SERVER_DEMO_PROMETHEUS_URL=https://demo-prometheus.oxynote.io
      - HEIMDALL_GATE_CHANGEDETECTION_API_URL=http://changedetection:5000
      - HEIMDALL_GATE_CONNECTOR_URL=http://heimdall-connector:8080
    env_file:
      - ./env/env.gate
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    volumes:
      - ./config/github/oxynote.private-key.pem:/etc/oxynote/github/oxynote.private-key.pem
    restart: unless-stopped
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  heimdall-connector:
    container_name: heimdall-connector
    image: ghcr.io/oxynote/heimdall-connector:dev
    networks:
      - connector
    env_file:
      - ./env/env.connector
    restart: unless-stopped
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  heimdall-datagen:
    container_name: heimdall-datagen
    image: ghcr.io/oxynote/heimdall-datagen:dev
    restart: unless-stopped
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  postgres:
    image: postgres:16.4-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  meilisearch:
    container_name: meilisearch
    image: getmeili/meilisearch:v1.23
    volumes:
      - meilisearch_data:/meili_data
    env_file:
      - ./env/env.meilisearch
    restart: unless-stopped
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  valkey:
    container_name: valkey
    image: valkey/valkey:9.0-alpine
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  changedetection:
    container_name: changedetection
    image: dgtlmoon/changedetection.io
    volumes:
      - changedetection_data:/datastore
    environment:
      - HIDE_REFERER=true
      - LOGGER_LEVEL=WARNING
      - PLAYWRIGHT_DRIVER_URL=ws://browser-sockpuppet-chrome:3000
    depends_on:
      browser-sockpuppet-chrome:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  browser-sockpuppet-chrome:
    container_name: browser-sockpuppet-chrome
    hostname: browser-sockpuppet-chrome
    image: dgtlmoon/sockpuppetbrowser:latest
    cap_add:
      - SYS_ADMIN # TODO: Recommended in their docker-compose example, need to double-check this.
    restart: unless-stopped
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1024
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=10
      - LOG_LEVEL=WARNING
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./config/prometheus:/etc/prometheus/
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--web.config.file=/etc/prometheus/web.yaml"
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  datagen-prometheus:
    container_name: datagen-prometheus
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - datagen_prometheus_data:/prometheus
      - ./config/datagen-prometheus:/etc/prometheus/
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"
  telegraf:
    container_name: telegraf
    image: telegraf:1.33-alpine
    restart: unless-stopped
    volumes:
      - ./config/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      # For host metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      # For Docker metrics (optional)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
    logging:
      driver: local
      options:
        mode: non-blocking
        max-size: 10m
        max-file: "3"

networks:
  connector:

volumes:
  postgres_data:
  meilisearch_data:
  valkey_data:
  caddy_data:
  caddy_config:
  changedetection_data:
  prometheus_data:
  datagen_prometheus_data:
