[agent]
  interval = "10s"
  flush_interval = "10s"

# Output to Prometheus (exposes /metrics endpoint)
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2

# Host system metrics
[[inputs.cpu]]
  percpu = true
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay"]

[[inputs.diskio]]

[[inputs.net]]

# Docker container metrics (optional)
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
