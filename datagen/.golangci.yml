version: "2"
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - contextcheck
    - copyloopvar
    - cyclop
    - depguard
    - dogsled
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - inamedparam
    - interfacebloat
    - intrange
    - iotamixing
    - loggercheck
    - maintidx
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wsl_v5
    - zerologlint
  disable:
    - containedctx
    - decorder
    - dupl
    - exhaustruct
    - funcorder
    - funlen
    - godox
    - goheader
    - gosmopolitan
    - grouper
    - iface
    - ireturn
    - lll
    - makezero
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - testpackage
    - tparallel
    - varnamelen
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 25
    errcheck:
      check-blank: true
    depguard:
      rules:
        main:
          deny:
            - pkg: gotest.tools/assert
            - pkg: github.com/bmizerany/assert
    exhaustive:
      default-signifies-exhaustive: true
    goconst:
      min-occurrences: 5
      numbers: true
    gomoddirectives:
      # datagen builds against the core module in this same repository, so
      # the local replace is how the two are wired, not a leftover.
      replace-local: true
    forbidigo:
      forbid:
        # timeutil.Now is mockable; time.Now is not, which makes every
        # clock-dependent path untestable through it.
        - pattern: ^time\.Now$
          msg: use timeutil.Now instead
    gocritic:
      disabled-checks:
        - hugeParam
        - unnamedResult
        - sloppyReassign
        - rangeValCopy
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated
    govet:
      disable:
        - fieldalignment
      enable-all: true
    nakedret:
      max-func-lines: 20
    paralleltest:
      ignore-missing: true
    prealloc:
      for-loops: true
    promlinter:
      strict: true
    recvcheck:
      exclusions:
        - '*.Value'
        - '*.Scan'
    revive:
      enable-all-rules: true
      rules:
        - name: unchecked-type-assertion
          disabled: true
        - name: import-alias-naming
          disabled: true
        - name: unnecessary-stmt
          disabled: true
        - name: argument-limit
          disabled: true
        - name: function-result-limit
          disabled: true
        - name: cyclomatic
          severity: warning
          disabled: true
        - name: line-length-limit
          severity: warning
          disabled: true
        - name: cognitive-complexity
          severity: warning
          disabled: true
        - name: confusing-naming
          disabled: true
        - name: confusing-results
          disabled: true
        - name: unhandled-error
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: function-length
          disabled: true
        - name: banned-characters
          disabled: true
        - name: file-header
          disabled: true
        - name: add-constant
          disabled: true
        - name: comment-spacings
          disabled: true
        - name: unused-receiver
          disabled: true
        - name: nested-structs
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: empty-lines
          disabled: true
        - name: if-return
          disabled: true
        - name: enforce-switch-style
          disabled: true
    rowserrcheck:
      packages:
        - github.com/jmoiron/sqlx
    tagalign:
      align: false
      sort: true
      order:
        - json
        - db
    tagliatelle:
      case:
        rules:
          json: camel
    testifylint:
      disable:
        - require-error
    thelper:
      test:
        begin: false
    wsl_v5:
      allow-first-in-block: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - forbidigo
        path: cmd
        text: fmt.Print
      - linters:
          - forbidigo
        path: _test.go
        text: time.Now
      - linters:
          - gochecknoglobals
        text: ^_.+
      - linters:
          - forcetypeassert
          - gochecknoinits
          - maintidx
          - promlinter
          - usestdlibvars
        path: _test.go
      - linters:
          - gocritic
        text: 'unnecessaryDefer: defer'
      - linters:
          - err113
        text: do not define dynamic errors
      - linters:
          - gosec
        path: _test.go
        text: G112
      - linters:
          - gosec
        text: G115
      - linters:
          - musttag
        text: should be annotated with the `db`
      - linters:
          - goconst
        text: string `(true|false)` has
      # the gauge tables are tuned sampling parameters read as a block: every
      # bound, target and spike chance is one row of demo tuning, not a
      # threshold logic branches on. Naming each would bury the tables, and a
      # shared constant would tie together gauges that only coincide today.
      - linters:
          - goconst
          - mnd
        path: internal/gen
      - linters:
          - dupword
        source: '^//go:generate '
      - linters:
          - usetesting
        text: could be replaced by t.Context()
      - linters:
          - revive
        text: Import alias "v1" is redundant
      - linters:
          - cyclop
          - goconst
          - noctx
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
