version: 2
project_name: oxynote
dist: bin
snapshot:
  version_template: dev
builds:
  - id: oxynote-datagen
    main: ./cmd
    binary: "{{ .ProjectName }}-datagen"
    mod_timestamp: "{{ .CommitTimestamp }}"
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    tags:
      - "{{if not .IsSnapshot}} prod {{end}}"
    flags:
      - "-trimpath"
    ldflags:
      - "-s -w"
dockers_v2:
  - id: datagen
    ids:
      - oxynote-datagen
    dockerfile: ./Dockerfile.dev
    images:
      - ghcr.io/oxynote/datagen
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
    sbom: false
    flags:
      - "--provenance=false"
checksum:
  disable: true
archives:
  - formats: ["binary"] # disable archives
release:
  disable: true # disable release uploading to github/gitlab
changelog:
  use: github
  filters:
    exclude:
      - "^workflow(s?):"
      - "^github:"
announce:
  skip: true
