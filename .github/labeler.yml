# labels for actions/labeler. A pull request gets every label whose rule
# matches at least one changed file. Under all-globs-to-any-file, one file
# must match every glob, so a "!" glob carves a folder out of a wider one.
# Feature globs match folder names at any depth, so a new package or handler
# under an existing feature name is labeled without a change here.

# components

web:
  - changed-files:
      - any-glob-to-any-file:
          - web/**

electron:
  - changed-files:
      - any-glob-to-any-file:
          - web/electron/**
          - web/forge.config.ts
          - web/vite.electron.config.ts
          - web/app/plugins/{electron-auth.client,host.client,01.process-user-agent}.ts
          - web/app/composables/useDetectHost.ts
          - web/app/pages/desktop-auth.vue

server/core:
  - changed-files:
      - any-glob-to-any-file:
          - server/core/**

server/auth-realtime:
  - changed-files:
      - any-glob-to-any-file:
          - server/auth-realtime/**

packages/common:
  - changed-files:
      - any-glob-to-any-file:
          - packages/common/**

datagen:
  - changed-files:
      - any-glob-to-any-file:
          - datagen/**
          - docker/demo/**

e2e:
  - changed-files:
      - any-glob-to-any-file:
          - e2e/**

docker:
  - changed-files:
      - any-glob-to-any-file:
          - docker/**
          - "**/Dockerfile*"
          - "**/.goreleaser.yml"

helm:
  - changed-files:
      - any-glob-to-any-file:
          - helm/**
          - e2e/helm/**
          - e2e/tests/helm-*
          - e2e/playwright.helm.config.ts
          - scripts/helm-*
          - scripts/check-helm-env.mjs

dev-env:
  - changed-files:
      - any-glob-to-any-file:
          - "**/Makefile"
          - scripts/**
          - server/core/scripts/**
          - .vscode/**
          - .gitignore
          - .gitattributes
          - "**/.dockerignore"
          - "**/Dockerfile.dev"

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/dependabot.yml
          - .github/labeler.yml

docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - "**/README.md"
          - "{CONTRIBUTING,SECURITY}.md"
          - LICENSE
          - .github/ISSUE_TEMPLATE/**
          - .github/pull_request_template.md

# languages

# dependabot adds these labels to its own pull requests. The labeler removes
# a label whose rule does not match, so each rule also covers the manifest
# and lock files that a dependency update changes.

go:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.go"
          - "**/go.{mod,sum}"

typescript:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.{ts,vue,js,mjs}"
          - "**/package.json"
          - "**/pnpm-{lock,workspace}.yaml"

docker-compose:
  - changed-files:
      - any-glob-to-any-file:
          - "**/docker-compose*.yaml"

# a pull request gets this label in two ways. It comes from dependabot, whose
# branches all start with "dependabot/". Or it changes a manifest or lock file.
# Dockerfiles, compose files and workflows are not listed, because most
# changes to them are not dependency updates.
dependencies:
  - head-branch:
      - ^dependabot/
  - changed-files:
      - any-glob-to-any-file:
          - "**/package.json"
          - "**/pnpm-{lock,workspace}.yaml"
          - "**/go.{mod,sum}"

