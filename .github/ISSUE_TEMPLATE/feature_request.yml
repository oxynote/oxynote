name: Feature request
description: Suggest a new feature or an improvement.
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you propose?
      description: Add sketches or screenshots if it helps.
    validations:
      required: true
