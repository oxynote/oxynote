name: Feature request
description: Suggest something Oxynote can't do yet.
type: Feature
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Oxynote to do?
      description: Describe the feature and why you need it.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: How do you imagine it working?
      description: Describe how you would use it step by step. Add sketches or screenshots if it helps.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle this today?
      description: Another tool, a workaround, or not at all.
