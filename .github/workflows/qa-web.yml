name: QA

on:
  push:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/qa-web.yml
  pull_request:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/qa-web.yml

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Linting web
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Installing dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Run check-lint
        run: pnpm run check-lint
        working-directory: web

  test:
    name: Testing web
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Installing dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Run tests
        run: pnpm run test
        working-directory: web
