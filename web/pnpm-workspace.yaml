# Electron Forge's packaging toolchain expects a flat, npm-style node_modules
# layout on disk.
# https://www.electronjs.org/docs/latest/tutorial/tutorial-first-app#initializing-your-npm-project
nodeLinker: hoisted

# @prometheus-io/codemirror-promql imports the grammar itself, so the fork
# has to win that resolution rather than only the app's own imports.
overrides:
  "@prometheus-io/lezer-promql": "npm:@oxynote/lezer-promql@0.314.0-oxynote.1"
  # electron-forge's toolchain pins vulnerable majors: @electron/node-gyp
  # wants tar 6 (upstream node-gyp 11 runs the same tar.extract calls on 7)
  # and external-editor wants tmp 0.0.x (tmpNameSync is unchanged in 0.2).
  tar: "^7.5.22"
  tmp: "^0.2.7"

# Install scripts for native/binary packages.
allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "electron-winstaller": true
  "esbuild": true
  "unrs-resolver": true
  "vue-demi": true

# electron-forge's dependency chain pulls @electron/node-gyp from a git fork
# (via @electron/rebuild). pnpm blocks exotic git-resolved subdeps by default.
blockExoticSubdeps: false

# pnpm quarantines freshly published versions as a supply-chain guard. The
# grammar is ours, published by its own repository's workflow, so a release
# is usable the moment it exists — every new version needs a line here.
minimumReleaseAgeExclude:
  - "@oxynote/lezer-promql@0.314.0-oxynote.1"
