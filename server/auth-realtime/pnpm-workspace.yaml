allowBuilds:
        esbuild: true

# @better-auth/core takes jose and kysely as peers, and src imports both
# directly. When our copy and better-auth's differ, core is installed twice
# as structurally incompatible instances. "$name" makes every consumer use
# our own package.json range, so the pin moves whenever that range does.
overrides:
        jose: "$jose"
        kysely: "$kysely"
