allowBuilds:
        esbuild: true

# @better-auth/core takes each of these as a peer, so a second copy of any
# one forks it into structurally incompatible instances. Pin only versions
# every consumer's range already accepts, and drop a pin once the duplicate
# is gone.
overrides:
        "@opentelemetry/api": "1.9.1"
        jose: "6.2.10"
        kysely: "0.29.5"
