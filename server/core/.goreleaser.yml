version: 2
project_name: oxynote
dist: bin
snapshot:
  # the tag a snapshot image carries. Defaults to dev for the dev stack;
  # the e2e stack overrides it so a run cannot clobber the image the dev
  # stack is using. Set through core's Makefile IMAGE_TAG.
  version_template: '{{ envOrDefault "CORE_SNAPSHOT_TAG" "dev" }}'
builds:
  - id: core
    main: ./cmd/core
    binary: "{{ .ProjectName }}-core"
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    # goarch takes no template, so every architecture a Docker engine may
    # run is compiled and dockers_v2 below builds the image for one of them.
    goarch:
      - amd64
      - arm64
    tags:
      - "{{if not .IsSnapshot}} prod {{end}}"
    flags:
      - "-trimpath"
    ldflags:
      - "-s -w"
dockers_v2:
  - id: core
    ids:
      - core
    dockerfile: ./Dockerfile.dev
    images:
      - ghcr.io/oxynote/core
    tags:
      - "{{ .Version }}"
      - latest
    # a snapshot loads one image per platform into the local daemon, so only
    # the engine's own architecture is built. Set through core's Makefile
    # DOCKER_ARCH.
    platforms:
      - 'linux/{{ envOrDefault "DOCKER_ARCH" "amd64" }}'
    build_args:
      BINARY: oxynote-core
    sbom: false
    flags:
      - "--provenance=false"
checksum:
  disable: true
archives:
  - formats: ["binary"] # disable archives
release:
  disable: true # disable release uploading to github/gitlab
changelog:
  use: github
  filters:
    exclude:
      - "^workflow(s?):"
      - "^github:"
announce:
  skip: true
