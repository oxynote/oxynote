version: 2
project_name: oxynote
dist: bin
snapshot:
  version_template: dev
builds:
  - id: core
    main: ./cmd/core
    binary: "{{ .ProjectName }}-core"
    mod_timestamp: "{{ .CommitTimestamp }}"
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    tags:
      - "{{if not .IsSnapshot}} prod {{end}}"
    flags:
      - "-trimpath"
    ldflags:
      - "-s -w"
      - "-X github.com/oxynote/oxynote/server/core/internal/buildinfo._name={{ .ProjectName }}_core"
      - "-X github.com/oxynote/oxynote/server/core/internal/buildinfo._version={{ .Version }}"
      - "-X github.com/oxynote/oxynote/server/core/internal/buildinfo._commit={{ .ShortCommit }}"
      - "-X github.com/oxynote/oxynote/server/core/internal/buildinfo._timestampString={{ .CommitDate }}"
dockers_v2:
  - id: core
    ids:
      - core
    dockerfile: ./Dockerfile.dev
    images:
      - ghcr.io/oxynote/core
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
    build_args:
      BINARY: oxynote-core
    sbom: false
    flags:
      - "--provenance=false"
checksum:
  disable: true
archives:
  - formats: ["binary"] # disable archives
release:
  disable: true # disable release uploading to github/gitlab
changelog:
  use: github
  filters:
    exclude:
      - "^workflow(s?):"
      - "^github:"
announce:
  skip: true
